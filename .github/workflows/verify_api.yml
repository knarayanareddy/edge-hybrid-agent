name: Live API Verification Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to test"
        required: false
        default: "google/gemini-2.5-flash"

jobs:
  verify-api:
    name: Test Live Cloud Inference & 11 Built-in Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Multi-Tool E2E Verification
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY_1 }}
          MODEL_NAME: ${{ github.event.inputs.model || 'google/gemini-2.5-flash' }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ.get("OPENROUTER_KEY", "").strip()
          model = os.environ.get("MODEL_NAME", "google/gemini-2.5-flash")

          if not api_key:
              print("❌ ERROR: OPENROUTER_KEY secret is missing or empty!")
              sys.exit(1)

          masked_key = api_key[:8] + "..." + api_key[-4:] if len(api_key) > 12 else "***"
          print(f"🔑 Using API Key: {masked_key}")
          print(f"🤖 Testing Model: {model}")
          print("=" * 70)

          # Complete set of 11 preloaded tools exactly matching SkillLoader.kt
          tools = [
              {
                  "type": "function",
                  "function": {
                      "name": "get_current_weather",
                      "description": "Get current weather conditions and temperature for any city in the world.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "location": {"type": "string", "description": "City name, for example Amsterdam or Tokyo."}
                          },
                          "required": ["location"],
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "convert_temperature",
                      "description": "Convert a numeric temperature between Celsius, Fahrenheit, Kelvin, and Rankine.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "value": {"type": "number", "description": "Temperature value to convert."},
                              "from": {"type": "string", "description": "Source unit: C, F, K, or R."},
                              "to": {"type": "string", "description": "Target unit: C, F, K, or R."}
                          },
                          "required": ["value", "from", "to"],
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "search_wikipedia",
                      "description": "Search Wikipedia for detailed factual information about companies, historical events, scientific concepts, places, or famous entities.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "query": {"type": "string", "description": "The subject, company, person, or concept to research (e.g. 'Achmea', 'ASML', 'Amsterdam')."}
                          },
                          "required": ["query"],
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "convert_currency",
                      "description": "Convert currency amounts in real-time using current exchange rates (EUR, USD, GBP, JPY, INR, CAD, AUD, etc.).",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "amount": {"type": "number", "description": "The numeric monetary amount to convert."},
                              "from": {"type": "string", "description": "3-letter source currency code, e.g. USD, EUR, GBP."},
                              "to": {"type": "string", "description": "3-letter target currency code, e.g. EUR, JPY, INR."}
                          },
                          "required": ["amount", "from", "to"],
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "calculate_math",
                      "description": "Evaluate mathematical expressions, formulas, percentages, exponents, powers, and roots.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "expression": {"type": "string", "description": "Mathematical expression to evaluate, e.g. '(150 * 0.21) + 45' or 'sqrt(144) * 5'."}
                          },
                          "required": ["expression"],
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "get_world_time",
                      "description": "Look up the current local time, date, day of week, and UTC timezone offset for any major world city.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "city": {"type": "string", "description": "City name, e.g. Amsterdam, Tokyo, London, New York."}
                          },
                          "required": ["city"],
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "get_device_status",
                      "description": "Get device hardware status including battery percentage, charging state, available RAM, and network connection type.",
                      "parameters": {
                          "type": "object",
                          "properties": {},
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "toggle_flashlight",
                      "description": "Toggle the device physical camera flashlight / torch on or off.",
                      "parameters": {
                          "type": "object",
                          "properties": {},
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "set_timer",
                      "description": "Set an on-device countdown timer or alarm.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "seconds": {"type": "integer", "description": "Duration of the timer in seconds."},
                              "message": {"type": "string", "description": "Label or description for the timer."}
                          },
                          "required": ["seconds", "message"],
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "create_quick_note",
                      "description": "Save a quick note or reminder to the secure on-device database.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "title": {"type": "string", "description": "Title of the note."},
                              "content": {"type": "string", "description": "Body content or details of the note."}
                          },
                          "required": ["title", "content"],
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "list_quick_notes",
                      "description": "Retrieve recent notes saved locally on the device.",
                      "parameters": {
                          "type": "object",
                          "properties": {},
                          "additionalProperties": False
                      }
                  }
              }
          ]

          system_instruction = (
              "You are Edge Hybrid Agent, an intelligent, helpful, and highly knowledgeable mobile AI assistant running on a Samsung Galaxy device. "
              "You can answer any questions, explain complex concepts, research companies, write code, brainstorm, and converse naturally on any topic. "
              "You also have access to native device tools and cloud skills (such as checking current weather, converting units, setting timers, or controlling device hardware). "
              "If a user asks a general question or asks about a company, place, or concept, answer it thoroughly, accurately, and conversationally using your broad general knowledge. "
              "Only call a tool when specifically needed."
          )

          def send_query(prompt, expected_tool=None, image_data_url=None):
              if image_data_url:
                  user_content = [
                      {"type": "text", "text": prompt},
                      {"type": "image_url", "image_url": {"url": image_data_url}}
                  ]
              else:
                  user_content = prompt

              payload = {
                  "model": model,
                  "messages": [
                      {"role": "system", "content": system_instruction},
                      {"role": "user", "content": user_content}
                  ],
                  "tools": tools,
                  "tool_choice": "auto",
                  "max_tokens": 2048
              }
              req = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "HTTP-Referer": "https://edgehybrid.agent",
                      "X-Title": "Edge Hybrid Agent Multi-Tool Test"
                  }
              )
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  msg = data["choices"][0]["message"]
                  if "tool_calls" in msg and msg["tool_calls"]:
                      tc = msg["tool_calls"][0]
                      name = tc["function"]["name"]
                      args = tc["function"]["arguments"]
                      print(f"   🛠️ Tool Called: {name}")
                      print(f"   📦 Arguments: {args}")
                      if expected_tool and name != expected_tool:
                          print(f"   ⚠️ Expected tool '{expected_tool}' but got '{name}'")
                      return ("tool", name, args)
                  else:
                      snippet = msg.get("content", "").strip()[:180] + "..."
                      print(f"   💬 Direct Answer: {snippet}")
                      return ("answer", None, msg.get("content"))

          test_cases = [
              ("Tell me about Achmea in Amsterdam", "General Q&A about Dutch insurance company", None, None),
              ("What's the weather in Amsterdam right now?", "Live weather check", "get_current_weather", None),
              ("Convert 100 degrees Celsius to Fahrenheit", "Temperature unit converter", "convert_temperature", None),
              ("Search Wikipedia for ASML semiconductor", "Wikipedia deep dive", "search_wikipedia", None),
              ("Convert 150 EUR to USD", "Currency conversion", "convert_currency", None),
              ("Calculate sqrt(144) * 8.5 + 25", "Math evaluator", "calculate_math", None),
              ("What time is it in Tokyo right now?", "World time lookup", "get_world_time", None),
              ("Check my device battery and available memory", "Device status query", "get_device_status", None),
              ("Can you toggle my flashlight?", "Native hardware action", "toggle_flashlight", None),
              ("Set a timer for 10 minutes for cooking pasta", "Native timer creation", "set_timer", None),
              ("Save a quick note titled 'Groceries' with content 'Buy milk and eggs'", "Create quick note", "create_quick_note", None),
              ("Show my recent saved notes", "List quick notes", "list_quick_notes", None),
              ("What color is this square?", "Multimodal Vision (Red Pixel)", None, "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==")
          ]

          print("\n🧪 EXECUTING FULL MULTI-TOOL & MULTIMODAL VERIFICATION SUITE:")
          for i, (prompt, desc, expected_tool, img_url) in enumerate(test_cases, 1):
              print(f"\n[{i}/{len(test_cases)}] Testing: '{prompt}' ({desc})")
              try:
                  res_type, tool_name, content = send_query(prompt, expected_tool, img_url)
                  print("   ✅ Passed (HTTP 200 OK)")
              except urllib.error.HTTPError as e:
                  err = e.read().decode("utf-8")
                  print(f"   ❌ HTTP Error {e.code}: {err}")
                  sys.exit(1)

          print("\n" + "=" * 70)
          print(f"🎉 ALL {len(test_cases)} E2E MULTI-TOOL & VISION TESTS COMPLETED & VERIFIED 100% SUCCESSFULLY!")
          EOF

      - name: Verify Gemini Direct API (if configured)
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, sys, urllib.request, urllib.error, json
          gemini_key = os.environ.get("GEMINI_KEY", "").strip()
          if not gemini_key:
              print("ℹ️ GEMINI_API_KEY not configured or empty, skipping direct Gemini API test.")
              sys.exit(0)

          print("🔍 Testing Gemini Direct API endpoint...")
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={gemini_key}"
          payload = {"contents": [{"parts": [{"text": "Reply with 'GEMINI_OK'"}]}]}
          try:
              req = urllib.request.Request(url, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  text = data["candidates"][0]["content"]["parts"][0]["text"]
                  print(f"   ✅ Gemini Direct API Response: {text.strip()}")
          except urllib.error.HTTPError as e:
              print(f"   ⚠️ Gemini Direct API warning HTTP {e.code}: {e.read().decode('utf-8')[:150]}")
          EOF

      - name: Verify Groq Whisper Endpoint & Model
        env:
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, sys, urllib.request, urllib.error, json, io, wave, struct
          groq_key = os.environ.get("GROQ_KEY", "").strip()
          if not groq_key:
              print("ℹ️ GROQ_API_KEY secret not present, skipping.")
              sys.exit(0)

          print("🔍 Testing Groq Whisper API endpoint with actual audio payload...")
          # Generate 1s 16kHz test audio in memory
          wav_buf = io.BytesIO()
          with wave.open(wav_buf, "wb") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(16000)
              import math
              for i in range(16000):
                  s = int(32767.0 * 0.5 * math.sin(2.0 * math.pi * 440.0 * i / 16000.0))
                  wf.writeframes(struct.pack("<h", s))
          audio_data = wav_buf.getvalue()

          boundary = "GroqTestBoundary123"
          body = bytearray()
          body.extend(b"--" + boundary.encode() + b"\r\n")
          body.extend(b'Content-Disposition: form-data; name="model"\r\n\r\nwhisper-large-v3\r\n')
          body.extend(b"--" + boundary.encode() + b"\r\n")
          body.extend(b'Content-Disposition: form-data; name="response_format"\r\n\r\njson\r\n')
          body.extend(b"--" + boundary.encode() + b"\r\n")
          body.extend(b'Content-Disposition: form-data; name="file"; filename="test.wav"\r\n')
          body.extend(b"Content-Type: audio/wav\r\n\r\n")
          body.extend(audio_data)
          body.extend(b"\r\n--" + boundary.encode() + b"--\r\n")

          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/audio/transcriptions",
              data=bytes(body),
              headers={
                  "Authorization": f"Bearer {groq_key}",
                  "User-Agent": "EdgeHybridAgent/1.0",
                  "Content-Type": f"multipart/form-data; boundary={boundary}"
              }
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  res = json.loads(resp.read().decode())
                  print(f"   ✅ Groq Whisper Transcribed Successfully: {res}")
          except urllib.error.HTTPError as e:
              print(f"   ❌ Groq API error HTTP {e.code}: {e.read().decode()}")
              sys.exit(1)
          EOF

      - name: Verify Unified Multi-Service Conversation (Audio + Reasoning + Vision + Tools in 1 Chat)
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY_1 }}
          GROQ_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_NAME: ${{ github.event.inputs.model || 'google/gemini-2.5-flash' }}
        run: |
          python3 - << 'EOF'
          import urllib.request, json, os, io, wave, struct, sys

          openrouter_key = os.environ.get("OPENROUTER_KEY", "").strip()
          groq_key = os.environ.get("GROQ_KEY", "").strip()
          model = os.environ.get("MODEL_NAME", "google/gemini-2.5-flash")

          print("=" * 70)
          print("🌟 RUNNING UNIFIED MULTI-SERVICE CONVERSATION TEST")
          print("   Testing 1 Continuous Multi-Turn Chat Interleaving:")
          print("   Audio Transcription -> LLM Reasoning -> Cloud Tool -> Vision -> Local Tool")
          print("=" * 70)

          # Turn 1: Ingesting Meeting Transcript
          meeting_notes = "Team meeting: Achmea Amsterdam project kickoff. Tasks: 1. Research Achmea history. 2. Verify budget conversion of 5000 EUR to USD. 3. Check Amsterdam office weather. 4. Save summary note."
          messages = [
              {
                  "role": "system",
                  "content": (
                      "You are Edge Hybrid Agent on a Samsung device. You maintain continuous conversation context, "
                      "analyze transcripts, call native tools when needed, understand images, and answer general questions."
                  )
              },
              {
                  "role": "user",
                  "content": f"Here is our transcribed meeting recording:\n\"\"\"{meeting_notes}\"\"\"\nWhat are our next steps?"
              }
          ]

          tools = [
              {
                  "type": "function",
                  "function": {
                      "name": "search_wikipedia",
                      "description": "Search Wikipedia for factual background on companies and topics.",
                      "parameters": {"type": "object", "properties": {"query": {"type": "string"}}, "required": ["query"]}
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "convert_currency",
                      "description": "Convert money between currencies.",
                      "parameters": {"type": "object", "properties": {"amount": {"type": "number"}, "from": {"type": "string"}, "to": {"type": "string"}}, "required": ["amount", "from", "to"]}
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "create_quick_note",
                      "description": "Save note on device.",
                      "parameters": {"type": "object", "properties": {"title": {"type": "string"}, "content": {"type": "string"}}, "required": ["title", "content"]}
                  }
              }
          ]

          def call_llm():
              req = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=json.dumps({
                      "model": model,
                      "messages": messages,
                      "tools": tools,
                      "tool_choice": "auto"
                  }).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {openrouter_key}",
                      "Content-Type": "application/json",
                      "HTTP-Referer": "https://edgehybrid.agent"
                  }
              )
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode())
                  return data["choices"][0]["message"]

          # Turn 1 Evaluation
          print("\n[Turn 1: Transcript Reasoning]")
          msg1 = call_llm()
          print(f"   💬 Assistant: {msg1.get('content', '')[:120]}...")
          messages.append(msg1)

          # Turn 2: Tool Call in the same conversation (Wikipedia)
          print("\n[Turn 2: Research Tool Call in Same Chat]")
          messages.append({"role": "user", "content": "Execute step 1: please look up Achmea on Wikipedia."})
          msg2 = call_llm()
          assert "tool_calls" in msg2 and msg2["tool_calls"], "Expected tool call for search_wikipedia"
          tc = msg2["tool_calls"][0]
          print(f"   🛠️ Tool Called: {tc['function']['name']}({tc['function']['arguments']})")
          messages.append(msg2)
          messages.append({
              "role": "tool",
              "tool_call_id": tc["id"],
              "name": tc["function"]["name"],
              "content": "Achmea is one of the largest financial services and insurance corporations in the Netherlands, based in Zeist and Amsterdam."
          })

          # Turn 3: Multimodal Vision in the same conversation!
          print("\n[Turn 3: Multimodal Vision in Same Chat]")
          red_pixel = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
          messages.append({
              "role": "user",
              "content": [
                  {"type": "text", "text": "Our team attached this diagram of the budget chart. What color is this sample?"},
                  {"type": "image_url", "image_url": {"url": red_pixel}}
              ]
          })
          msg3 = call_llm()
          print(f"   👁️ Vision Response: {msg3.get('content', '')[:100]}...")
          messages.append(msg3)

          # Turn 4: Financial Tool Call (Currency conversion)
          print("\n[Turn 4: Financial Tool Call in Same Chat]")
          messages.append({"role": "user", "content": "Now convert the 5000 EUR budget to USD."})
          msg4 = call_llm()
          assert "tool_calls" in msg4 and msg4["tool_calls"], "Expected tool call for convert_currency"
          tc_curr = msg4["tool_calls"][0]
          print(f"   🛠️ Tool Called: {tc_curr['function']['name']}({tc_curr['function']['arguments']})")
          messages.append(msg4)
          messages.append({
              "role": "tool",
              "tool_call_id": tc_curr["id"],
              "name": tc_curr["function"]["name"],
              "content": "5000 EUR is equal to 5450.00 USD at current exchange rates."
          })

          # Turn 5: Local Device Action (Note Saving)
          print("\n[Turn 5: On-Device Note Creation in Same Chat]")
          messages.append({"role": "user", "content": "Save a note on my device with the title 'Meeting Done' and content 'Achmea reviewed, budget $5450 USD approved.'"})
          msg5 = call_llm()
          assert "tool_calls" in msg5 and msg5["tool_calls"], "Expected tool call for create_quick_note"
          tc_note = msg5["tool_calls"][0]
          print(f"   🛠️ Tool Called: {tc_note['function']['name']}({tc_note['function']['arguments']})")

          print("\n" + "=" * 70)
          print("🎉 ALL 5 MULTI-TURN, MULTI-SERVICE CONVERSATION TURNS VERIFIED 100% SUCCESSFULLY!")
          print("=" * 70)
          EOF


