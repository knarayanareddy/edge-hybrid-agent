name: Live API Verification Test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to test"
        required: false
        default: "google/gemini-2.5-flash"
      test_prompt:
        description: "Custom test prompt"
        required: false
        default: "What is the weather in Amsterdam?"

jobs:
  verify-api:
    name: Test Live Cloud Inference & Tool Calling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run E2E Cloud Inference Verification
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY_1 }}
          MODEL_NAME: ${{ github.event.inputs.model || 'google/gemini-2.5-flash' }}
          TEST_PROMPT: ${{ github.event.inputs.test_prompt || 'What is the weather in Amsterdam?' }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ.get("OPENROUTER_KEY", "").strip()
          model = os.environ.get("MODEL_NAME", "google/gemini-2.5-flash")
          prompt = os.environ.get("TEST_PROMPT", "What is the weather in Amsterdam?")

          if not api_key:
              print("❌ ERROR: OPENROUTER_KEY secret is missing or empty!")
              sys.exit(1)

          masked_key = api_key[:8] + "..." + api_key[-4:] if len(api_key) > 12 else "***"
          print(f"🔑 Using API Key: {masked_key}")
          print(f"🤖 Testing Model: {model}")
          print("=" * 60)

          # Test 1: Plain conversational call (tools = null)
          print("\n[TEST 1] Plain Conversational Inference (tools = null)")
          payload_1 = {
              "model": model,
              "messages": [{"role": "user", "content": "Respond with 'SYSTEM ONLINE' and one sentence describing yourself."}],
              "max_tokens": 2048
          }
          req_1 = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps(payload_1).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://edgehybrid.agent",
                  "X-Title": "Edge Hybrid Agent Test"
              }
          )
          try:
              with urllib.request.urlopen(req_1) as resp:
                  res_data = json.loads(resp.read().decode("utf-8"))
                  content = res_data["choices"][0]["message"]["content"]
                  print("✅ HTTP 200 OK")
                  print(f"💬 Assistant Response: {content.strip()}")
          except urllib.error.HTTPError as e:
              err_body = e.read().decode("utf-8")
              print(f"❌ HTTP Error {e.code}: {err_body}")
              sys.exit(1)

          # Test 2: Tool-calling query with BuiltInSkillLoader schema
          print("\n" + "=" * 60)
          print(f"[TEST 2] Tool-Calling Inference with Weather Skill Schema")
          print(f"Prompt: '{prompt}'")
          
          tools = [
              {
                  "type": "function",
                  "function": {
                      "name": "get_current_weather",
                      "description": "Get current weather conditions for a city using Celsius.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "location": {
                                  "type": "string",
                                  "description": "City name, for example Tokyo or London."
                              }
                          },
                          "required": ["location"],
                          "additionalProperties": False
                      }
                  }
              },
              {
                  "type": "function",
                  "function": {
                      "name": "convert_temperature",
                      "description": "Convert a numeric temperature between Celsius, Fahrenheit, Kelvin, and Rankine.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "value": {"type": "number", "description": "Temperature value to convert."},
                              "from": {"type": "string", "description": "Source unit: C, F, K, or R."},
                              "to": {"type": "string", "description": "Target unit: C, F, K, or R."}
                          },
                          "required": ["value", "from", "to"],
                          "additionalProperties": False
                      }
                  }
              }
          ]

          payload_2 = {
              "model": model,
              "messages": [{"role": "user", "content": prompt}],
              "tools": tools,
              "tool_choice": "auto",
              "max_tokens": 2048
          }

          req_2 = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps(payload_2).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "HTTP-Referer": "https://edgehybrid.agent",
                  "X-Title": "Edge Hybrid Agent Test"
              }
          )

          try:
              with urllib.request.urlopen(req_2) as resp:
                  res_data = json.loads(resp.read().decode("utf-8"))
                  msg = res_data["choices"][0]["message"]
                  print("✅ HTTP 200 OK")
                  if "tool_calls" in msg and msg["tool_calls"]:
                      for tc in msg["tool_calls"]:
                          func = tc.get("function", {})
                          print(f"🛠️ Tool Call Triggered: {func.get('name')}")
                          print(f"📦 Arguments: {func.get('arguments')}")
                  else:
                      print(f"💬 Direct Assistant Answer: {msg.get('content')}")
          except urllib.error.HTTPError as e:
              err_body = e.read().decode("utf-8")
              print(f"❌ HTTP Error {e.code}: {err_body}")
              sys.exit(1)

          print("\n" + "=" * 60)
          print("🎉 ALL API INFERENCE & TOOL CALLING CHECKS PASSED SUCCESSFULLY!")
          EOF
