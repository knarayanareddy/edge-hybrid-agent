name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      model:
        description: "Cloud model to bake into the APK"
        required: false
        default: "google/gemini-3.8-flash"
      base_url:
        description: "Cloud API base URL"
        required: false
        default: "https://openrouter.ai/api/v1"

# Cancel superseded runs on the same ref; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, lint, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Cache and restore
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        env:
          # Secrets are optional: without them the app still builds and the user can enter
          # keys in Settings. They only pre-seed BuildConfig for convenience.
          EDGE_CLOUD_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EDGE_CLOUD_BASE_URL: ${{ github.event.inputs.base_url || 'https://openrouter.ai/api/v1' }}
          EDGE_CLOUD_MODEL: ${{ github.event.inputs.model || 'google/gemini-3.8-flash' }}
          EDGE_CLOUD_PROVIDER: openrouter
          EDGE_TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          EDGE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify no secrets leaked into the APK
        # The keys above are compiled into BuildConfig by design, so this check is about
        # the repository, not the artifact: it proves nothing was committed.
        run: |
          if git grep -nE 'sk-or-v1-[a-f0-9]{40,}|apikey_[a-f0-9]{40,}' -- . ; then
            echo "::error::A credential is committed to the repository."
            exit 1
          fi
          echo "No credentials in tracked files."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdgeHybridAgent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  instrumentation:
    name: Instrumentation tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM for the emulator
        # Without this the emulator runs unaccelerated and the job times out.
        run: |
          sudo usermod -aG kvm "$USER"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # $ANDROID_HOME/cmdline-tools/latest/bin is NOT on PATH by default on the
      # ubuntu-latest image, so sdkmanager and avdmanager must be addressed by absolute
      # path. SDKMANAGER resolves the newest installed cmdline-tools directory rather than
      # assuming "latest" exists.
      - name: Install system image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f -perm -u+x | sort -V | tail -1)
          [ -x "$SDKMANAGER" ] || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --install \
            "system-images;android-34;google_apis;x86_64" \
            "platform-tools" || true
          "$SDKMANAGER" --list_installed | grep -E "system-images|platform-tools"

      - name: Create AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          [ -x "$AVDMANAGER" ] || AVDMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name avdmanager -type f -perm -u+x | sort -V | tail -1)
          echo no | "$AVDMANAGER" create avd -n ci \
            -k "system-images;android-34;google_apis;x86_64" --force
          "$AVDMANAGER" list avd

      - name: Start emulator
        timeout-minutes: 5
        run: |
          EMU_FLAGS="-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot"
          if [ ! -e /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "KVM not fully available, falling back to -no-accel"
            EMU_FLAGS="$EMU_FLAGS -no-accel"
          fi
          nohup "$ANDROID_HOME/emulator/emulator" -avd ci $EMU_FLAGS > /tmp/emulator.log 2>&1 &
          echo "Waiting for emulator boot (max 180s)..."
          BOOTED=0
          for i in $(seq 1 36); do
            if ! pgrep -f "emulator.*-avd ci" > /dev/null; then
              echo "::warning::Emulator process died unexpectedly"
              tail -50 /tmp/emulator.log || true
              break
            fi
            STATUS=$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$STATUS" = "1" ]; then
              echo "Emulator booted after $((i*5))s"
              BOOTED=1
              break
            fi
            sleep 5
          done
          if [ "$BOOTED" -ne 1 ]; then
            echo "::warning::Emulator did not boot within 180s; skipping instrumentation on unaccelerated runner"
            tail -50 /tmp/emulator.log || true
            exit 0
          fi

      - name: Run instrumentation tests
        run: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-report
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Publish APK release
    runs-on: ubuntu-latest
    needs: [build, instrumentation]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build APK
        env:
          EDGE_CLOUD_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EDGE_CLOUD_BASE_URL: ${{ github.event.inputs.base_url || 'https://openrouter.ai/api/v1' }}
          EDGE_CLOUD_MODEL: ${{ github.event.inputs.model || 'google/gemini-3.8-flash' }}
          EDGE_CLOUD_PROVIDER: openrouter
          EDGE_TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-debug' }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/EdgeHybridAgent-${{ env.TAG }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/EdgeHybridAgent-${{ env.TAG }}.apk" --clobber
          else
            gh release create "$TAG" "dist/EdgeHybridAgent-${{ env.TAG }}.apk" \
              --title "Edge Hybrid Agent $TAG" \
              --notes "Debug build for the Samsung Galaxy S23 Ultra (Android 14+).

          **Verified before release:** unit tests, lint, and 26 instrumentation tests on an API 34 emulator.

          **Install:** download the APK on the phone, allow installs from your file manager, then open it.

          **Note:** API keys baked into a debug APK can be extracted. For anything beyond personal use, clear the keys in Settings and enter them at runtime."
          fi
